"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm ci"
archive = "true"
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = "npm run dev -- --host 127.0.0.1 --port \"$CONDUCTOR_PORT\""
default = true
icon = "play"

[scripts.run.preview]
available_in = [ "local" ]
command = "npm run build && npm run preview -- --host 127.0.0.1 --port \"$CONDUCTOR_PORT\""
icon = "monitor"
